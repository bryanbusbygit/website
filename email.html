<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Bryan Busby</title>
    <meta name="description" content="Email contact information for Bryan Busby.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;500;600&amp;display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --text: #111111;
        --link: #3f3f3f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 3rem 2rem;
        color: var(--text);
        background: var(--bg);
        font-family: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 1.2rem;
        line-height: 1.6;
      }

      main {
        width: min(100%, 760px);
      }

      h1 {
        margin: 0 0 2rem;
        font-size: 2.5rem;
        font-weight: 500;
        line-height: 1.15;
      }

      p {
        margin: 0 0 1.4rem;
      }

      a {
        color: var(--link);
        text-underline-offset: 0.14em;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #000000;
        --text: #eeeeea;
        --link: #ddddda;
      }

      @media (max-width: 640px) {
        body {
          padding: 1.75rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Contact</h1>
      <p>If the email link on the main page does not open your email app, my address is my first name, a period, and my last name, followed by the at sign and the domain "upr.edu".</p>
      <p><a href="index.html#about">Return to the website</a>.</p>
    </main>
  </body>
</html>
