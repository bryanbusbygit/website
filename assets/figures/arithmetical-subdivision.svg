<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="title desc">
<title id="title">Subdivision of an ordinary edge</title>
<desc id="desc">Labels a and b with quotients p and q become a path labeled a, a plus b, and b. The new quotient is 1 and the endpoint quotients increase by 1.</desc>
<g fill="none" stroke="#111" stroke-width="1.3">
<path d="M45 54H315 M45 168H315"/>
<path d="M180 90V117 M175 112L180 117L185 112"/>
<path d="M8 54H23 M337 54H352 M8 168H23 M337 168H352" stroke-dasharray="2 4"/>
</g>
<g font-family="Georgia, serif" text-anchor="middle">
<circle cx="45" cy="54" r="22" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text x="45" y="60" font-size="21" font-style="italic" fill="#111">a</text>
<text x="45" y="22" font-size="16" font-style="italic" fill="#565656">p</text>
<circle cx="315" cy="54" r="22" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text x="315" y="60" font-size="21" font-style="italic" fill="#111">b</text>
<text x="315" y="22" font-size="16" font-style="italic" fill="#565656">q</text>
<circle cx="45" cy="168" r="22" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text x="45" y="174" font-size="21" font-style="italic" fill="#111">a</text>
<text x="45" y="136" font-size="16" font-style="italic" fill="#565656">p + 1</text>
<circle cx="180" cy="168" r="22" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text x="180" y="174" font-size="16" font-style="italic" fill="#111">a + b</text>
<text x="180" y="136" font-size="16" font-style="italic" fill="#565656">1</text>
<circle cx="315" cy="168" r="22" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text x="315" y="174" font-size="21" font-style="italic" fill="#111">b</text>
<text x="315" y="136" font-size="16" font-style="italic" fill="#565656">q + 1</text>
</g>
</svg>
