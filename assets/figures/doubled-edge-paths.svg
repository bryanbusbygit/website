<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="The doubled-edge paths P 3,2 and P 1,5, redrawn from Glass and Wagner">
  <style>
    .edge { fill: none; stroke: #111; stroke-width: 1.6px; }
    circle { r: 20px; fill: #fff; stroke: #111; stroke-width: 1.6px; }
    text { fill: #111; font: italic 21px Georgia, serif; text-anchor: middle; dominant-baseline: central; }
  </style>

  <g aria-label="Path P 3,2">
    <path class="edge" d="M140 65H255M255 65H370M370 65Q427.5 30 485 65M370 65Q427.5 100 485 65M485 65H600"/>
    <circle cx="140" cy="65"/><circle cx="255" cy="65"/><circle cx="370" cy="65"/><circle cx="485" cy="65"/><circle cx="600" cy="65"/>
    <text x="140" y="65">a₃</text><text x="255" y="65">a₂</text><text x="370" y="65">a₁</text><text x="485" y="65">b₁</text><text x="600" y="65">b₂</text>
  </g>

  <g aria-label="Path P 1,5">
    <path class="edge" d="M100 175Q155 140 210 175M100 175Q155 210 210 175M210 175H320M320 175H430M430 175H540M540 175H650"/>
    <circle cx="100" cy="175"/><circle cx="210" cy="175"/><circle cx="320" cy="175"/><circle cx="430" cy="175"/><circle cx="540" cy="175"/><circle cx="650" cy="175"/>
    <text x="100" y="175">a₁</text><text x="210" y="175">b₁</text><text x="320" y="175">b₂</text><text x="430" y="175">b₃</text><text x="540" y="175">b₄</text><text x="650" y="175">b₅</text>
  </g>
</svg>
