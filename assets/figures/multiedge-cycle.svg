<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 390" role="img" aria-labelledby="title desc">
  <title id="title">A five-vertex cycle with a doubled edge</title>
  <desc id="desc">Hollow circular vertices v 1 through v 5 form a cycle. Two parallel edges join v 1 and v 2, and each label appears inside its vertex.</desc>
  <style>
    .edge { fill: none; stroke: #111; stroke-width: 1.6px; }
    circle { r: 25px; fill: #fff; stroke: #111; stroke-width: 1.6px; }
    text { fill: #111; font: italic 24px Georgia, serif; text-anchor: middle; dominant-baseline: central; }
  </style>

  <path class="edge" d="M250 67L111 112V258L250 303L336 185"/>
  <path class="edge" d="M250 67Q308 116 336 185"/>
  <path class="edge" d="M250 67Q266 140 336 185"/>

  <circle cx="250" cy="67"/><circle cx="336" cy="185"/><circle cx="250" cy="303"/><circle cx="111" cy="258"/><circle cx="111" cy="112"/>
  <text x="250" y="67">v₁</text><text x="336" y="185">v₂</text><text x="250" y="303">v₃</text><text x="111" y="258">v₄</text><text x="111" y="112">v₅</text>
</svg>
