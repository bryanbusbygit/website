<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Two arithmetical structures</title>
  <desc id="desc">Left: three parallel edges, r values 1, 1, 1, 1 and d values 4, 4, 2, 2 clockwise. Right: four parallel edges, r values 7, 5, 2, 1 and d values 3, 6, 3, 9 clockwise. Large r values appear inside vertices, and smaller d values sit outside.</desc>
  <style>
    .edge { fill: none; stroke: #111; stroke-width: 1.6px; }
    circle { fill: #fff; stroke: #111; stroke-width: 1.6px; }
    text { font-family: Georgia, serif; text-anchor: middle; dominant-baseline: central; }
    .r { fill: #111; font-size: 24px; }
    .d { fill: #565656; font-size: 18px; }
  </style>
  <g aria-label="Three parallel edges">
    <path class="edge" d="M110 85V245H290V85 M110 85Q200 25 290 85 M110 85H290 M110 85Q200 145 290 85"/>
    <circle cx="110" cy="85" r="22"/><circle cx="290" cy="85" r="22"/>
    <circle cx="290" cy="245" r="22"/><circle cx="110" cy="245" r="22"/>
    <g class="r"><text x="110" y="85">1</text><text x="290" y="85">1</text><text x="290" y="245">1</text><text x="110" y="245">1</text></g>
    <g class="d"><text x="69" y="85">4</text><text x="331" y="85">4</text><text x="331" y="245">2</text><text x="69" y="245">2</text></g>
  </g>
  <g aria-label="Four parallel edges">
    <path class="edge" d="M470 85V245H650V85 M470 85Q560 10 650 85 M470 85Q560 60 650 85 M470 85Q560 110 650 85 M470 85Q560 160 650 85"/>
    <circle cx="470" cy="85" r="22"/><circle cx="650" cy="85" r="22"/>
    <circle cx="650" cy="245" r="22"/><circle cx="470" cy="245" r="22"/>
    <g class="r"><text x="470" y="85">7</text><text x="650" y="85">5</text><text x="650" y="245">2</text><text x="470" y="245">1</text></g>
    <g class="d"><text x="429" y="85">3</text><text x="691" y="85">6</text><text x="691" y="245">3</text><text x="429" y="245">9</text></g>
  </g>
</svg>
